aid: crunched
name: Crunched
description: >-
  Crunched is an AI Excel analyst for power users in management consulting,
  investment banking, private equity, and corporate finance. Working as a native
  Microsoft Excel add-in (Mac and PC) and a companion PowerPoint deck reviewer,
  it builds fully linked financial models (DCFs, LBOs, cohort and scenario
  analyses) from plain-English instructions, error-checks entire workbooks,
  extracts and structures data from PDFs and web sources, formats spreadsheets,
  and generates client-ready slides with full workbook context. Every edit is
  tracked with a full audit trail and cited sources. Founded by Philip Borge and
  Michael Sakowski (ex-McKinsey private equity), Crunched is ISO 27001 and SOC 2
  Type II certified and GDPR compliant, and is backed by Y Combinator, First
  Round Capital, and 20VC. It is distributed through the Microsoft AppSource
  marketplace and does not currently publish a public developer API.
